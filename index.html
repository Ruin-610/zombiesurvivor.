<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゾンビサバイバー</title>
<style>
:root{--bg:#dfe6ee;--grid:#cbd5e1;--panel:#fffffff0;--ink:#16202e;--mut:#56657a;--acc:#e8590c;--hp:#d6336c;--xp:#2b8a3e;--bar:#00000022;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a24;--grid:#1f2835;--panel:#1d2634f0;--ink:#eef2f7;--mut:#9aa8bd;--bar:#ffffff22}}
:root[data-theme="dark"]{--bg:#141a24;--grid:#1f2835;--panel:#1d2634f0;--ink:#eef2f7;--mut:#9aa8bd;--bar:#ffffff22}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);pointer-events:none;font-weight:700}
#hud .row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--bar);overflow:hidden;margin-bottom:5px}
.bar.t{height:6px}
.bar i{display:block;height:100%;width:100%}
#hp{background:var(--hp)}#xp{background:var(--xp);width:0}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#0000006b}
#ov[hidden]{display:none}
.card{background:var(--panel);border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 10px 40px #0004;backdrop-filter:blur(6px)}
.card h1{margin:0 0 8px;font-size:26px;letter-spacing:.02em}
.card p{margin:0 0 14px;color:var(--mut);line-height:1.7;font-size:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:700;width:100%;font-size:16px}
.opt{display:block;text-align:left;background:transparent;color:var(--ink);border:2px solid var(--bar);margin-bottom:8px;padding:10px 14px}
.opt:hover,.opt:focus-visible{border-color:var(--acc);outline:0}
.opt b{display:block;font-size:16px}.opt small{color:var(--mut);font-weight:400;font-size:13px}
body.menu #hud,body.menu #pz{display:none}
#pz{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 68px);width:40px;height:40px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--ink);border:2px solid var(--bar);box-shadow:0 2px 10px #0003}
#pz:hover,#pz:focus-visible{border-color:var(--acc);outline:0}
.own{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.own span{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px 3px 4px;border-radius:999px;background:var(--bar)}
.own svg{width:22px;height:22px;display:block}
#mt{position:fixed;z-index:5;right:58px;top:calc(env(safe-area-inset-top,0px) + 68px);width:40px;height:40px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--ink);border:2px solid var(--bar);box-shadow:0 2px 10px #0003}
body.menu #mt{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px}
body.stg #hud{color:#eef2f7}body.stg .bar{background:#ffffff22}
.start+.start{margin-top:10px}.start.alt{background:linear-gradient(#ffd43b,#e8590c);color:#111}
.opt.lock{opacity:.45;cursor:default}
#ov.menu{flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 56px) 20px calc(env(safe-area-inset-bottom,0px) + 36px);background:linear-gradient(#000d,#0000 42%,#0000 62%,#000e)}
.title{display:contents;color:#fff}
.top{text-align:center}
.logo{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-style:italic;font-weight:900;line-height:.88;transform:skewX(-8deg);text-transform:uppercase}
.logo span{display:block}
.t1{font-size:clamp(54px,17vw,96px);letter-spacing:.04em;text-shadow:0 0 24px #ffffff55}
.t2{font-size:clamp(40px,13vw,74px);background:linear-gradient(#ffd43b,#e8590c 60%,#a61e1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #e8590caa)}
.tape{height:12px;margin:14px auto 10px;max-width:340px;background:repeating-linear-gradient(-45deg,#ffd43b 0 12px,#111 12px 24px);transform:skewX(-8deg)}
.sub{font-size:15px;letter-spacing:.5em;font-weight:700;color:#ffd8a8;text-align:center;padding-left:.5em}
.bot{text-align:center;width:100%;max-width:340px}
.start{transform:skewX(-8deg);font-size:22px;letter-spacing:.2em;padding:16px;border-radius:4px;box-shadow:0 0 0 3px #fff3,0 8px 30px #e8590c88}
.rec{margin:14px 0 4px;font-size:13px;color:#ffd8a8;font-variant-numeric:tabular-nums}
.how{font-size:12px;color:#fffa;line-height:1.6}
.card{max-height:calc(100vh - 40px);overflow-y:auto;touch-action:pan-y}
.nm{width:100%;box-sizing:border-box;font:inherit;font-size:17px;font-weight:700;text-align:center;padding:12px;margin-bottom:10px;border-radius:4px;border:2px solid #fff5;background:#000a;color:#fff;user-select:text;-webkit-user-select:text;transform:skewX(-8deg)}
.nm::placeholder{color:#fff8}.nm:focus{outline:0;border-color:#ffd43b}.nm.bad{border-color:#ff6b6b}.nm.bad::placeholder{color:#ffa8a8}
.rkb{background:transparent;color:#ffd8a8;font-size:14px;margin-top:6px;padding:8px;text-decoration:underline}
.lb{list-style:none;margin:0 0 4px;padding:0;font-variant-numeric:tabular-nums}
.lb li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 6px;border-bottom:1px solid var(--bar);font-size:14px}
.lb li.me{background:#e8590c22}.lb b{color:var(--acc)}.lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb em{font-style:normal;font-weight:700}
.lbh{margin:14px 0 4px;font-size:14px}
.card.wide{max-width:560px}
.pk.aw{border-color:#ffd43b;background:linear-gradient(165deg,#ffd43b44,#e8590c22 65%);box-shadow:0 0 24px #ffd43b88}
.pk.aw .tg,.pk.aw .lv{color:#e67700;font-weight:900}
.tt.red{color:#ffe3e3;text-shadow:0 0 14px #ff3b3b,0 0 4px #a61e1e;background:linear-gradient(90deg,#0000,#5c0000cc 20%,#5c0000cc 80%,#0000)}
.tt{position:fixed;left:50%;top:24%;z-index:30;transform:translateX(-50%);padding:10px 26px;font-weight:900;font-style:italic;font-size:clamp(18px,5.5vw,28px);white-space:nowrap;color:#fff;background:linear-gradient(90deg,#0000,#000c 20%,#000c 80%,#0000);text-shadow:0 0 14px #ffd43b,0 0 4px #e8590c;pointer-events:none}
@media(prefers-reduced-motion:no-preference){.tt{animation:ttin .4s cubic-bezier(.2,1.4,.4,1) backwards}@keyframes ttin{from{opacity:0;transform:translateX(-50%) scale(1.5)}}}
@media(prefers-reduced-motion:no-preference){.pk.aw::after{animation:awshine 1.6s ease-in-out infinite}@keyframes awshine{to{transform:translateX(100%)}}}
.rl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.rs{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,30px);font-weight:900;font-style:italic;border-radius:12px;border:2px solid var(--bar);color:var(--mut);transition:all .06s}
.rs.on{background:linear-gradient(#ffe066,#e8590c);color:#111;border-color:#ffd43b;box-shadow:0 0 22px #ffd43baa;transform:scale(1.1)}
.gt{display:flex;align-items:center;gap:10px;padding:6px 8px;margin-bottom:6px;border-radius:10px;border:2px solid color-mix(in srgb,var(--c) 50%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),transparent)}
.gt .im{width:36px;height:36px;flex:none}.gt .im svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 5px var(--c))}.gt b{flex:1;font-size:14px}.gt .lv{color:var(--c);font-weight:700;font-size:13px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;margin:0;background:transparent;color:var(--ink);border:2px solid var(--bar);border-radius:12px;font-weight:400;font-size:12px;width:auto;transition:transform .12s,border-color .12s}
.pk:hover,.pk:focus-visible{border-color:var(--acc);outline:0;transform:translateY(-3px)}
.pk .im{width:clamp(44px,14vw,64px);aspect-ratio:1;border-radius:12px;background:var(--bar);padding:6px;box-sizing:border-box}
.pk .im svg{width:100%;height:100%;display:block}
.pk b{font-size:13px}.pk .lv{color:var(--acc);font-weight:700;font-size:12px}.pk small{color:var(--mut);font-size:11px;line-height:1.4}
.pk{position:relative;overflow:hidden;padding-top:24px;border-color:color-mix(in srgb,var(--c) 50%,transparent);background:linear-gradient(165deg,color-mix(in srgb,var(--c) 26%,transparent),transparent 62%)}
.pk:hover,.pk:focus-visible{border-color:var(--c);box-shadow:0 6px 26px color-mix(in srgb,var(--c) 55%,transparent)}
.pk::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff40 50%,transparent 60%);transform:translateX(-100%);pointer-events:none}
.pk:hover::after{transform:translateX(100%);transition:transform .55s}
.pk .im{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 50%,transparent),transparent 72%)}
.pk .im svg{filter:drop-shadow(0 0 7px var(--c))}
.pk .lv{color:var(--c)}
.tg{position:absolute;left:8px;top:7px;font-size:10px;font-weight:700;color:var(--c);letter-spacing:.08em}
.nw{position:absolute;right:6px;top:6px;font-size:10px;font-weight:700;background:var(--c);color:#111;padding:1px 7px;border-radius:8px}
.pips{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;min-height:6px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--bar)}
.pips i.on{background:var(--c)}.pips i.nx{background:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
.lvh{font-style:italic;font-weight:900;font-size:30px;transform:skewX(-8deg);background:linear-gradient(#ffe066,#e8590c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #e8590c88)}
@media(prefers-reduced-motion:no-preference){.pk{animation:rise .4s cubic-bezier(.2,1.3,.4,1) backwards}.pk:nth-child(2){animation-delay:.07s}.pk:nth-child(3){animation-delay:.14s}.pips i.nx{animation:blink 1s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.92)}}@keyframes blink{50%{opacity:.35}}}
@media(prefers-reduced-motion:no-preference){.logo{animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}.start{animation:pulse 1.6s ease-in-out infinite .6s}@keyframes slam{from{opacity:0;transform:skewX(-8deg) scale(1.6)}to{opacity:1;transform:skewX(-8deg) scale(1)}}@keyframes pulse{50%{box-shadow:0 0 0 3px #fff3,0 8px 44px #e8590ccc;filter:brightness(1.15)}}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row"><span id="tm">0:00</span><span id="kl">撃破 0</span><span id="lvl">Lv.1</span></div>
  <div class="bar"><i id="hp"></i></div>
  <div class="bar t"><i id="xp"></i></div>
</div>
<button id="pz" aria-label="一時停止"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
<div id="ov"></div>
<button id="mt" aria-label="サウンド"></button>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
const LOW=matchMedia('(pointer: coarse)').matches,ECAP=350;
if(LOW)try{Object.defineProperty(ctx,'shadowBlur',{set(){},get(){return 0}})}catch(e){}
let W,H,col={};
function readCol(){const s=getComputedStyle(document.documentElement);col.bg=s.getPropertyValue('--bg').trim();col.grid=s.getPropertyValue('--grid').trim()}
function rs(){const d=Math.min(devicePixelRatio||1,LOW?1.5:2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCol);rs();readCol();

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const joy={on:0,id:-1,ox:0,oy:0,x:0,y:0};
cv.addEventListener('pointerdown',e=>{joy.on=1;joy.id=e.pointerId;joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.pointerId==joy.id){joy.x=e.clientX;joy.y=e.clientY}});
const pup=e=>{if(e.pointerId==joy.id)joy.on=0};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);

const ITEMS={
 kunai:{n:'クナイ',d:'最も近い敵へ自動発射。強化で本数と威力が上昇',max:7},
 blade:{n:'回転ブレード',d:'身体の周りを回る刃。強化で枚数が増える',max:7},
 bomb:{n:'爆弾',d:'敵の群れに投げる範囲攻撃',max:7},
 spd:{n:'ダッシュシューズ',d:'移動速度 +10%',max:5},
 hp:{n:'ヘルスブースト',d:'最大HP +25 と回復',max:5},
 mag:{n:'マグネット',d:'経験値の回収範囲 +40%',max:4},
 shot:{n:'ショットガン',d:'近距離に散弾を広くばらまく',max:7},
 bat:{n:'野球バット',d:'前方を強打して敵を吹き飛ばす',max:7},
 bolt:{n:'落雷',d:'近くの敵に雷を落とす。強化で落雷数UP',max:7},
 power:{n:'パワーグローブ',d:'全ダメージ +12%',max:5},
 haste:{n:'エナジードリンク',d:'攻撃間隔が短くなる +10%',max:5},
 crit:{n:'クリティカルレンズ',d:'会心率 +8%（2倍ダメージ）',max:5},
 exp:{n:'知恵の書',d:'獲得経験値 +15%',max:5},
 regen:{n:'自然治癒',d:'HPが毎秒少しずつ回復する',max:5},
 field:{n:'フォースフィールド',d:'周囲に持続ダメージ＋減速のフィールドを展開',max:7},
 laser:{n:'レーザーガン',d:'敵へ向けて常時照射。強化で太さと威力UP',max:0},
 lzb:{n:'レーザーガン【蒼】',d:'照射した敵を少し押し返す。【赫】と合体で覚醒',max:6},
 lzr:{n:'レーザーガン【赫】',d:'命中した敵が小爆発する範囲攻撃。【蒼】と合体で覚醒',max:6},
 mariko:{n:'まりこの怒り',d:'取得で即MAX。経験値+50%、全ダメージ+5%、攻撃間隔-5%',max:1}
};
const ICON={
 kunai:'<svg viewBox="0 0 64 64"><path d="M32 4L42 30L32 40L22 30Z" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2" stroke-linejoin="round"/><rect x="29" y="40" width="6" height="14" rx="2" fill="#e8590c"/><circle cx="32" cy="58" r="4" fill="none" stroke="#e8590c" stroke-width="3"/></svg>',
 blade:'<svg viewBox="0 0 64 64"><path d="M32 4L38 26L60 32L38 38L32 60L26 38L4 32L26 26Z" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2" stroke-linejoin="round"/><circle cx="32" cy="32" r="6" fill="#339af0"/></svg>',
 bomb:'<svg viewBox="0 0 64 64"><circle cx="30" cy="38" r="20" fill="#343a40"/><circle cx="23" cy="31" r="5" fill="#868e96" opacity=".6"/><rect x="26" y="14" width="10" height="8" rx="2" fill="#495057"/><path d="M36 16Q46 8 50 14" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><circle cx="52" cy="12" r="5" fill="#ffd43b"/><circle cx="52" cy="12" r="2.5" fill="#fff"/></svg>',
 spd:'<svg viewBox="0 0 64 64"><path d="M14 42L14 26Q14 22 19 22L28 22Q32 32 42 34L54 38Q58 40 58 46L58 48L14 48Z" fill="#339af0"/><rect x="14" y="46" width="44" height="6" rx="3" fill="#e8590c"/><path d="M4 28h8M2 36h10M6 44h6" stroke="#ffd43b" stroke-width="3" stroke-linecap="round"/></svg>',
 hp:'<svg viewBox="0 0 64 64"><path d="M32 56C8 40 6 22 18 14C25 10 31 14 32 20C33 14 39 10 46 14C58 22 56 40 32 56Z" fill="#f03e3e"/><path d="M32 26v16M24 34h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>',
 mag:'<svg viewBox="0 0 64 64"><path d="M14 10H26V34a6 6 0 0 0 12 0V10H50V34a18 18 0 0 1-36 0Z" fill="#f03e3e"/><rect x="14" y="10" width="12" height="10" fill="#e9ecef"/><rect x="38" y="10" width="12" height="10" fill="#e9ecef"/><path d="M8 4l4 4M56 4l-4 4M32 2v6" stroke="#ffd43b" stroke-width="3" stroke-linecap="round"/></svg>'
};
const COL={kunai:'#ff922b',blade:'#4dabf7',bomb:'#ff6b6b',spd:'#38d9a9',hp:'#ff6b81',mag:'#b197fc'};
const WEAP=['kunai','blade','bomb','shot','bat','bolt','field','laser','lzb','lzr'];
const FR=l=>(55+8*l)*(l>=7?1.4:1);
const FUSEK=k=>(k=='lzb'&&G.w.lzb==5&&G.w.lzr>=6)||(k=='lzr'&&G.w.lzr==5&&G.w.lzb>=6);
const AWK=k=>(WEAP.includes(k)&&G.w[k]==6&&k!='lzb'&&k!='lzr')||FUSEK(k);
const AWN={kunai:'千影ノ穿孔刃',blade:'天輪ノ裂空刃',bomb:'終焉ノ紅蓮星',shot:'獄炎ノ哆哮砲',bat:'神殺シノ覇王棍',bolt:'雷帝ノ天罰',field:'絶対領域ノ結界',laser:'滅光ノ終極砲',lzb:'レーザーガン【茈】',lzr:'レーザーガン【茈】'};
function powerZ(){G.aw++;G.rushT=Math.max(G.t+5,G.rushT-8);for(const e of G.en){e.hp*=1.6;e.mh*=1.6;e.sp*=1.1;e.dmg*=1.3}setTimeout(()=>toast('ゾンビが強化された！','red'),1200)}
function toast(t,c){const d=document.createElement('div');d.className='tt'+(c?' '+c:'');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
const AWD={kunai:'本数＋2、貫通＋3。弾幕が一気に増える',blade:'刃が＋2枚、範囲と威力が大幅アップ',bomb:'爆発範囲と威力が1.5倍、投擲間隔も短縮',shot:'散弾が2倍になり射程も延びる',bat:'全方位を薙ぎ払う。範囲と吹き飛ばしも強化',bolt:'落雷＋3本、落雷の範囲も拡大',field:'範囲1.4倍、威力1.5倍。敵を強力に減速',laser:'ビームが約1.6倍の太さと威力に。射程も延びる',lzb:'【蒼】と【赫】が合体。極太の茈光線が4本になる',lzr:'【蒼】と【赫】が合体。極太の茈光線が4本になる'};
Object.assign(ICON,{

 if(G.ru>0){const a=Math.min(1,G.ru)*.35*(.7+.3*Math.sin(G.t*8)),g2=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.7);g2.addColorStop(0,'#ff000000');g2.addColorStop(1,`rgba(255,40,40,${a})`);ctx.fillStyle=g2;ctx.fillRect(0,0,W,H)}
 {const mb=G.en.find(e=>e.mega||e.st);if(mb){const bw=W-96,x0=14,y0=78;ctx.fillStyle='#000a';ctx.fillRect(x0-2,y0-2,bw+4,14);ctx.fillStyle=mb.mega?'#e03131':'#f08c00';ctx.fillRect(x0,y0,bw*Math.max(0,mb.hp)/mb.mh,10);ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.fillText(mb.mega?'魔王':'BOSS',x0+4,y0+9)}}
 if(joy.on){ctx.strokeStyle='#e8590c';ctx.lineWidth=2;ctx.globalAlpha=.6;
  ctx.beginPath();ctx.arc(joy.ox,joy.oy,50,0,6.283);ctx.stroke();
  const jx=joy.x-joy.ox,jy=joy.y-joy.oy,m=Math.min(50,Math.hypot(jx,jy)),a=Math.atan2(jy,jx);
  ctx.fillStyle='#e8590c';ctx.beginPath();ctx.arc(joy.ox+Math.cos(a)*m,joy.oy+Math.sin(a)*m,18,0,6.283);ctx.fill();ctx.globalAlpha=1}
 $('tm').textContent=G.stg?(G.sb?'BOSS':fmt(Math.max(0,G.stg.dur-G.t))):fmt(G.t);$('kl').textContent='撃破 '+G.k+(G.aw?'　凶暴化 '+G.aw:'');$('lvl').textContent='Lv.'+G.lv;
 $('hp').style.width=Math.max(0,p.hp/p.mh*100)+'%';$('xp').style.width=Math.min(100,G.xp/G.need*100)+'%';
}
function loop(t){try{loop0(t)}catch(e){console.error(e)}requestAnimationFrame(loop)}
function loop0(t){const dt=Math.min(.05,(t-last)/1000);last=t;audTick();if(G.state=='play')upd(dt);else if(G.state=='menu'){G.p.hp=G.p.mh=9999;G.xp=0;upd(dt);if(G.t>40){reset();G.state='menu'}}draw()}

reset();G.state='menu';
function showTitle(){MODE='endless';reset();G.state='menu';const b=best();ov(`<div class="title"><div class="top"><div class="logo"><span class="t1">Zombie</span><span class="t2">Survivor</span></div><div class="tape"></div><div class="sub">ゾンビサバイバー</div></div><div class="bot"><input id="nm" class="nm" maxlength="12" placeholder="ユーザーネーム（エンドレスのランキング用）" autocomplete="off" value="${esc(NAME)}"><button id="st" class="start alt">ストーリーモード</button><button id="go" class="start">エンドレスモード</button><button id="rk" class="rkb">ランキングを見る</button><div class="rec">最長生存 ${fmt(b.t)}　最多撃破 ${b.k}</div><div class="how">ドラッグで移動（PCはWASDか矢印キー）。攻撃は自動。<br>60秒ごとにボスが出現します。</div></div></div>`,'menu');$('go').onclick=begin;$('st').onclick=()=>{const n=$('nm');if(n)NAME=n.value.trim().slice(0,12)||NAME;showStages()};$('rk').onclick=showRank;$('nm').onkeydown=e=>{if(e.key==='Enter')begin()}}
showTitle();

requestAnimationFrame(t=>{last=t;loop(t)});
</script>
